<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Aryan</title>
  <meta name="description" content="Laravel and Drupal projects by Aryan — e-commerce, APIs, government CMS platforms, and multilingual websites." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="page-hero-inner">
          <p class="eyebrow reveal">Portfolio</p>
          <h1 class="section-title reveal">Projects</h1>
          <p class="section-copy reveal">
            A selection of live platforms across Laravel and Drupal, including commerce systems,
            APIs, government data tools, and multilingual publishing sites.
          </p>
        </div>
      </div>
    </section>

    <section class="section section--flush-top">
      <div class="container">
        <div id="project-list" class="project-list" aria-live="polite"></div>

        <nav class="pagination" id="project-pagination" aria-label="Projects pagination" hidden>
          <button type="button" class="pagination-btn" id="page-prev" aria-label="Previous page">Previous</button>
          <div class="pagination-pages" id="page-numbers"></div>
          <button type="button" class="pagination-btn" id="page-next" aria-label="Next page">Next</button>
          <p class="pagination-meta" id="page-meta"></p>
        </nav>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/projects-data.js"></script>
  <script src="partials/header.js"></script>
  <script src="partials/footer.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
